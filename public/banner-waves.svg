<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMaxYMax meet">
  <!-- Cintas de seda del banner de marca: nacen en punta abajo a la izquierda
       y suben curvándose hasta el borde derecho, con brillo en el canto. -->
  <defs>
    <linearGradient id="fill" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d6ee" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#c9d6ee" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#c9d6ee" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <path d="M 30 330 C 250 300, 440 190, 600 30 L 600 105 C 450 230, 270 315, 30 330 Z" fill="url(#fill)"/>
  <path d="M 30 330 C 250 300, 440 190, 600 30" fill="none" stroke="url(#edge)" stroke-width="1.6"/>
  <path d="M 150 400 C 340 375, 490 290, 600 190 L 600 255 C 500 330, 360 392, 150 400 Z" fill="url(#fill)"/>
  <path d="M 150 400 C 340 375, 490 290, 600 190" fill="none" stroke="url(#edge)" stroke-width="1.4"/>
</svg>
